name: Synthetic demo tests

on:
  push:
    branches:
      - main
      - commercial/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test and audit dependencies
        run: |
          python -m pip install -r requirements-comparison.txt
          python -m pip install -r requirements-audit-crypto.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate paired pilot JSON Schema syntax
        run: python -m json.tool experiments/schemas/paired-pilot-input-v1.schema.json > /dev/null
      - name: Validate registration evidence and event-chain JSON Schema syntax
        run: |
          python -m json.tool experiments/schemas/registration-evidence-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/audit-event-chain-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/audit-chain-checkpoint-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/audit-chain-checkpoint-series-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/audit-trust-store-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/audit-chain-checkpoint-signature-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/timestamp-trust-anchor-pin-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/rfc3161-tsa-anchor-provenance-v1.schema.json > /dev/null
          python -m json.tool experiments/schemas/rfc3161-tsa-anchor-provenance-signature-v1.schema.json > /dev/null
      - name: Run paired pilot metrics fixture
        run: python experiments/pilot_metrics.py experiments/fixtures/paired-pilot-synthetic-v1.json --json-out /tmp/paired-pilot-report.json
      - name: Run legacy fuzzy comparison harness
        run: python run_test.py
      - name: Run synthetic demonstration
        run: python demo/dss_demo.py
      - name: Run synthetic vehicle-event benchmark
        run: python experiments/vehicle_collision_bench.py --total 1000 --seed 88
      - name: Run synthetic address mutation benchmark
        run: python experiments/address_mutation_bench.py
