name: Synthetic demo tests

on:
  push:
    branches:
      - main
      - commercial/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install legacy comparison dependency
        run: python -m pip install -r requirements-comparison.txt
      - name: Run legacy fuzzy comparison harness
        run: python run_test.py
      - name: Run synthetic demonstration
        run: python demo/dss_demo.py
      - name: Run synthetic vehicle-event benchmark
        run: python experiments/vehicle_collision_bench.py --total 1000 --seed 88
      - name: Run synthetic address mutation benchmark
        run: python experiments/address_mutation_bench.py
